name: Update devenv.lock

# Weekly bump of devenv.lock as a PR, merged once the new environment passes tests and build.
# PRs opened with GITHUB_TOKEN don't trigger CI, so the checks run here before the PR is opened.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - run: nix profile install nixpkgs#devenv

      - run: devenv update

      - id: diff
        run: git diff --quiet devenv.lock || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed
        run: devenv shell -- bash -c "npm test && npm run build"

      - if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c devenv-update
          git commit -m "Update devenv.lock" devenv.lock
          git push --force origin devenv-update
          gh pr create --title "Update devenv.lock" --body "Weekly \`devenv update\`. Tests and build passed in the updated environment." --head devenv-update
          gh pr merge --squash --delete-branch devenv-update
