name: Update devenv.lock

# Weekly bump of devenv.lock, committed straight to main once the new environment passes tests and build.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - run: nix profile install nixpkgs#devenv

      - run: devenv update

      - id: diff
        run: git diff --quiet devenv.lock || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed
        run: devenv shell -- bash -c "npm test && npm run build"

      - if: steps.diff.outputs.changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update devenv.lock" devenv.lock
          git push
